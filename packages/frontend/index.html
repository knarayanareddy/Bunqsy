<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <!--
      Content Security Policy. The dashboard renders merchant names, receipt OCR
      output and LLM narration — all attacker-influenced strings. React escapes
      them, but CSP is the backstop if any of that ever reaches innerHTML.
      'unsafe-inline' is required for React's style attributes and the pre-paint
      theme script; script sources are still pinned to this origin.
      frame-ancestors is intentionally omitted (it is ignored in meta anyway) so
      the dashboard can be embedded in the preview pane.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               form-action 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' https://fonts.gstatic.com data:;
               img-src 'self' data: blob:;
               media-src 'self' blob: data:;
               connect-src 'self' ws: wss:;"
    />
    <!-- Resolve the theme before first paint so there is no white/black flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bunqsy_theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#ffffff' : '#000000');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <title>BUNQSY — Financial Guardian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
